<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mielcita Pro</title>
    <style>
        :root { --negro: #000000; --oro: #D4AF37; --gris-card: #1c1c1e; --blanco: #ffffff; --rojo: #ff3b30; --verde: #34c759; }
        body { background: var(--negro); color: var(--blanco); font-family: -apple-system, sans-serif; margin: 0; }
        header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; background: var(--negro); z-index: 100; }
        .menu-btn { font-size: 28px; color: var(--oro); cursor: pointer; }
        .title { flex-grow: 1; text-align: center; color: var(--oro); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #111; transition: 0.3s; z-index: 200; border-right: 1px solid var(--oro); padding-top: 60px; }
        .sidebar.open { left: 0; }
        .sidebar a { display: block; padding: 20px; color: white; text-decoration: none; border-bottom: 1px solid #222; font-size: 14px; text-transform: uppercase; }
        .overlay { position: fixed; display: none; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; }

        /* Contenedores */
        .container { padding: 20px; display: none; }
        .container.active { display: block; }

        /* Cards & UI */
        .card-gestion { background: var(--gris-card); border-radius: 15px; padding: 18px; margin-bottom: 15px; border: 1px solid #333; }
        .card-item { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid var(--oro); }
        .btn-oro { background: var(--oro); color: black; border: none; padding: 14px; width: 100%; font-weight: bold; border-radius: 10px; margin-top: 10px; text-transform: uppercase; cursor: pointer; }
        .btn-action { padding: 8px 12px; border-radius: 8px; font-size: 10px; font-weight: bold; text-transform: uppercase; border: 1px solid; background: none; cursor: pointer; margin-top: 5px; }
        .btn-edit { color: var(--oro); border-color: var(--oro); }
        .btn-del { color: var(--rojo); border-color: var(--rojo); }
        .btn-riego { color: var(--verde); border-color: var(--verde); }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .badge-oro { background: var(--oro); color: black; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .badge-etapa { border: 1px solid var(--oro); color: var(--oro); padding: 1px 6px; border-radius: 5px; font-size: 10px; text-transform: uppercase; margin-left: 5px; }
        
        .plant-detail { padding: 10px; background: #0a0a0a; border-radius: 8px; margin-top: 8px; border: 1px solid #222; }
        .plant-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #222; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <div class="title" id="header-title">INICIO</div>
</header>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<nav class="sidebar" id="sidebar">
    <a href="#" onclick="navTo('home')">🏠 Inicio</a>
    <a href="#" onclick="navTo('carpas')">🎪 Configuración Carpas</a>
    <a href="#" onclick="navTo('plantas')">🌱 Añadir Plantas</a>
</nav>

<!-- INICIO: VISTA DIDÁCTICA CENTRAL -->
<div id="sec-home" class="container active">
    <div id="alert-zone"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
        <div class="card-gestion" style="text-align:center"><span id="h-c-count" style="color:var(--oro); font-size:22px">0</span><br><small>CARPAS</small></div>
        <div class="card-gestion" style="text-align:center"><span id="h-p-count" style="color:var(--oro); font-size:22px">0</span><br><small>PLANTAS</small></div>
    </div>
    <div id="home-render"></div>
</div>

<!-- CARPAS: SOLO CONFIGURACIÓN -->
<div id="sec-carpas" class="container">
    <div class="card-gestion">
        <h4 id="c-form-title" style="color:var(--oro); margin:0">Nueva Carpa</h4>
        <input type="hidden" id="c-edit-id">
        <input type="text" id="c-nom" placeholder="Nombre (Ej: Carpa Pro)">
        <input type="text" id="c-med" placeholder="Medidas (Ej: 100x100)">
        <input type="date" id="c-fec">
        <button class="btn-oro" onclick="saveCarpa()">Guardar Carpa</button>
    </div>
</div>

<!-- PLANTAS: FORMULARIO DE INGRESO -->
<div id="sec-plantas" class="container">
    <div class="card-gestion">
        <h4 style="color:var(--oro); margin:0">Nueva Planta</h4>
        <select id="p-sel-carpa"><option>Cargando carpas...</option></select>
        <input type="text" id="p-gen" placeholder="Genética / Nombre">
        <input type="text" id="p-ban" placeholder="Banco (Opcional)">
        <input type="date" id="p-fec">
        <button class="btn-oro" onclick="addPlanta()">Añadir a Carpa</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7ujVTiYTmi0nateG6j49g1",
        authDomain: "mielcita-app.firebaseapp.com",
        projectId: "mielcita-app",
        storageBucket: "mielcita-app.firebasestorage.app",
        messagingSenderId: "937808209169",
        appId: "1:937808209169:web:f280acbc42dd07b1341604"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const calcDias = (f) => Math.floor((new Date() - new Date(f)) / (1000*60*60*24)) || 0;

    let carpas = [];
    let plantas = [];
    let riegos = [];

    window.toggleMenu = () => {
        const s = document.getElementById('sidebar');
        const o = document.getElementById('overlay');
        s.classList.toggle('open');
        o.style.display = s.classList.contains('open') ? 'block' : 'none';
    };

    window.navTo = (s) => {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById('sec-'+s).classList.add('active');
        document.getElementById('header-title').innerText = s.toUpperCase();
        toggleMenu();
    };

    // --- ACCIONES FIREBASE ---
    window.saveCarpa = async () => {
        const id = document.getElementById('c-edit-id').value;
        const data = { nombre: document.getElementById('c-nom').value, medida: document.getElementById('c-med').value, fecha: document.getElementById('c-fec').value };
        if(!data.nombre || !data.fecha) return;
        id ? await updateDoc(doc(db, "carpas", id), data) : await addDoc(collection(db, "carpas"), { ...data, etapa: 'Germinación' });
        navTo('home');
    };

    window.addPlanta = async () => {
        const data = { carpaId: document.getElementById('p-sel-carpa').value, genetica: document.getElementById('p-gen').value, banco: document.getElementById('p-ban').value, fecha: document.getElementById('p-fec').value };
        if(data.genetica && data.carpaId) {
            await addDoc(collection(db, "plantas"), data);
            navTo('home');
        }
    };

    window.addRiego = async (id) => {
        const fecha = new Date().toISOString().split('T')[0];
        await addDoc(collection(db, "riegos"), { carpaId: id, fecha: fecha });
        alert("¡Riego registrado hoy!");
    };

    window.del = async (col, id) => { if(confirm("¿Seguro quieres eliminar?")) await deleteDoc(doc(db, col, id)); };

    window.editCarpa = (id, n, m, f) => {
        navTo('carpas');
        document.getElementById('c-edit-id').value = id;
        document.getElementById('c-nom').value = n; document.getElementById('c-med').value = m; document.getElementById('c-fec').value = f;
        document.getElementById('c-form-title').innerText = "Editar Carpa";
    };

    // --- RENDERIZADO ---
    const render = () => {
        const home = document.getElementById('home-render');
        const pSel = document.getElementById('p-sel-carpa');
        const az = document.getElementById('alert-zone');
        
        home.innerHTML = ""; pSel.innerHTML = ""; az.innerHTML = "";

        carpas.forEach(c => {
            pSel.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
            
            const pDeC = plantas.filter(p => p.carpaId === c.id);
            const lastR = riegos.filter(r => r.carpaId === c.id)[0];
            const diasSinRiego = lastR ? calcDias(lastR.fecha) : calcDias(c.fecha);

            if(diasSinRiego >= 3) az.innerHTML += `<div class="card-gestion" style="border-left:4px solid var(--rojo); padding:10px; font-size:12px">⚠️ <b>${c.nombre}</b> necesita riego (hace ${diasSinRiego} días)</div>`;

            const htmlPlants = pDeC.map(p => `
                <div class="plant-row">
                    <span>🌱 <b>${p.genetica}</b> (${p.banco}) - ${calcDias(p.fecha)} días</span>
                    <button class="btn-action btn-del" onclick="del('plantas','${p.id}')">Eliminar</button>
                </div>
            `).join('');

            home.innerHTML += `
                <div class="card-item">
                    <div onclick="const d = this.nextElementSibling; d.style.display = d.style.display === 'none' ? 'block' : 'none'">
                        <span class="badge-oro">Día ${calcDias(c.fecha)}</span><span class="badge-etapa">${c.etapa}</span>
                        <h3 style="margin:10px 0 5px 0; color:var(--oro)">${c.nombre}</h3>
                        <small style="color:#888">${c.medida} • Toca para gestionar plantas</small>
                    </div>
                    <div class="plant-detail" style="display:none">
                        ${htmlPlants || '<p style="font-size:12px; color:#666">No hay plantas. Ve a "Añadir Plantas" para empezar.</p>'}
                        <div style="display:flex; gap:10px; margin-top:15px; border-top:1px solid #222; padding-top:10px">
                            <button class="btn-action btn-riego" onclick="addRiego('${c.id}')">REGISTRAR RIEGO</button>
                            <button class="btn-action btn-edit" onclick="editCarpa('${c.id}','${c.nombre}','${c.medida}','${c.fecha}')">EDITAR</button>
                            <button class="btn-action btn-del" onclick="del('carpas','${c.id}')">BORRAR</button>
                        </div>
                        <small style="display:block; margin-top:10px; color:#555">Último riego: ${lastR ? lastR.fecha : 'Sin registros'}</small>
                    </div>
                </div>`;
        });

        document.getElementById('h-c-count').innerText = carpas.length;
        document.getElementById('h-p-count').innerText = plantas.length;
    };

    onSnapshot(collection(db, "carpas"), s => { carpas = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
    onSnapshot(collection(db, "plantas"), s => { plantas = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
    onSnapshot(query(collection(db, "riegos"), orderBy("fecha", "desc")), s => { riegos = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
</script>
</body>
</html>
