<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mielcita Pro</title>
    <style>
        :root { --negro: #000000; --oro: #D4AF37; --gris-card: #1c1c1e; --blanco: #ffffff; --rojo: #ff3b30; --verde: #34c759; }
        body { background: var(--negro); color: var(--blanco); font-family: -apple-system, sans-serif; margin: 0; }
        header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; background: var(--negro); z-index: 100; }
        .menu-btn { font-size: 28px; color: var(--oro); cursor: pointer; }
        .title { flex-grow: 1; text-align: center; color: var(--oro); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Sidebar */
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #111; transition: 0.3s; z-index: 200; border-right: 1px solid var(--oro); padding-top: 60px; }
        .sidebar.open { left: 0; }
        .sidebar a { display: block; padding: 20px; color: white; text-decoration: none; border-bottom: 1px solid #222; font-size: 14px; text-transform: uppercase; }
        .overlay { position: fixed; display: none; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; }

        /* Contenedores */
        .container { padding: 20px; display: none; animation: fadeIn 0.3s; }
        .container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Cards & UI */
        .card-gestion { background: var(--gris-card); border-radius: 15px; padding: 18px; margin-bottom: 15px; border: 1px solid #333; }
        .card-item { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid var(--oro); }
        .btn-oro { background: var(--oro); color: black; border: none; padding: 14px; width: 100%; font-weight: bold; border-radius: 10px; margin-top: 10px; text-transform: uppercase; cursor: pointer; }
        .btn-action { padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; border: 1px solid; background: none; cursor: pointer; }
        .btn-edit { color: var(--oro); border-color: var(--oro); }
        .btn-del { color: var(--rojo); border-color: var(--rojo); }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .badge-oro { background: var(--oro); color: black; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .badge-etapa { border: 1px solid var(--oro); color: var(--oro); padding: 1px 6px; border-radius: 5px; font-size: 10px; text-transform: uppercase; margin-left: 5px; }
        
        .plant-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <div class="title" id="header-title">INICIO</div>
</header>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<nav class="sidebar" id="sidebar">
    <a href="#" onclick="navTo('home')">🏠 Inicio</a>
    <a href="#" onclick="navTo('carpas')">🎪 Gestión Carpas</a>
    <a href="#" onclick="navTo('plantas')">🌱 Gestión Plantas</a>
    <a href="#" onclick="navTo('riego')">💧 Registro Riego</a>
</nav>

<!-- SECCIÓN: INICIO -->
<div id="sec-home" class="container active">
    <div id="alert-zone"></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
        <div class="card-gestion" style="text-align:center"><span id="h-c-count" style="font-size:20px; color:var(--oro)">0</span><br><small>CARPAS</small></div>
        <div class="card-gestion" style="text-align:center"><span id="h-p-count" style="font-size:20px; color:var(--oro)">0</span><br><small>PLANTAS</small></div>
    </div>
    <div id="home-render"></div>
</div>

<!-- SECCIÓN: CARPAS -->
<div id="sec-carpas" class="container">
    <div class="card-gestion">
        <h4 id="c-form-title" style="color:var(--oro); margin:0">Nueva Carpa</h4>
        <input type="hidden" id="c-edit-id">
        <input type="text" id="c-nom" placeholder="Nombre (Ej: Carpa 1)">
        <input type="text" id="c-med" placeholder="Medidas (Ej: 80x80)">
        <input type="date" id="c-fec">
        <button class="btn-oro" id="c-btn-save" onclick="saveCarpa()">Registrar Carpa</button>
    </div>
    <div id="carpas-list-render"></div>
</div>

<!-- SECCIÓN: PLANTAS -->
<div id="sec-plantas" class="container">
    <div class="card-gestion">
        <h4 style="color:var(--oro); margin:0">Nueva Planta</h4>
        <select id="p-sel-carpa"></select>
        <input type="text" id="p-gen" placeholder="Genética (Strain)">
        <input type="text" id="p-ban" placeholder="Banco (Opcional)">
        <input type="date" id="p-fec">
        <button class="btn-oro" onclick="addPlanta()">Añadir Planta</button>
    </div>
    <div id="plantas-list-render"></div>
</div>

<!-- SECCIÓN: RIEGO -->
<div id="sec-riego" class="container">
    <div class="card-gestion">
        <h4 style="color:var(--oro); margin:0">Registrar Riego</h4>
        <select id="r-sel-carpa"></select>
        <input type="date" id="r-fec">
        <button class="btn-oro" onclick="addRiego()">Guardar Riego</button>
    </div>
    <div id="riego-list-render"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7ujVTiYTmi0nateG6j49g1",
        authDomain: "mielcita-app.firebaseapp.com",
        projectId: "mielcita-app",
        storageBucket: "mielcita-app.firebasestorage.app",
        messagingSenderId: "937808209169",
        appId: "1:937808209169:web:f280acbc42dd07b1341604"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const calcDias = (f) => Math.floor((new Date() - new Date(f)) / (1000*60*60*24)) || 0;

    let carpas = [];
    let plantas = [];
    let riegos = [];

    window.toggleMenu = () => {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('open') ? 'block' : 'none';
    };

    window.navTo = (s) => {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById('sec-'+s).classList.add('active');
        document.getElementById('header-title').innerText = s.toUpperCase();
        if(document.getElementById('sidebar').classList.contains('open')) toggleMenu();
    };

    // --- CARPAS LÓGICA ---
    window.saveCarpa = async () => {
        const id = document.getElementById('c-edit-id').value;
        const data = { nombre: document.getElementById('c-nom').value, medida: document.getElementById('c-med').value, fecha: document.getElementById('c-fec').value };
        if(!data.nombre || !data.fecha) return;
        id ? await updateDoc(doc(db, "carpas", id), data) : await addDoc(collection(db, "carpas"), { ...data, etapa: 'Germinación' });
        document.getElementById('c-edit-id').value = ""; document.getElementById('c-nom').value = "";
    };

    window.editCarpa = (id, n, m, f) => {
        navTo('carpas');
        document.getElementById('c-edit-id').value = id;
        document.getElementById('c-nom').value = n; document.getElementById('c-med').value = m; document.getElementById('c-fec').value = f;
        document.getElementById('c-form-title').innerText = "Editar Carpa";
    };

    // --- PLANTAS LÓGICA ---
    window.addPlanta = async () => {
        const data = { carpaId: document.getElementById('p-sel-carpa').value, genetica: document.getElementById('p-gen').value, banco: document.getElementById('p-ban').value, fecha: document.getElementById('p-fec').value };
        if(data.genetica && data.carpaId) await addDoc(collection(db, "plantas"), data);
    };

    // --- RIEGO LÓGICA ---
    window.addRiego = async () => {
        const data = { carpaId: document.getElementById('r-sel-carpa').value, fecha: document.getElementById('r-fec').value };
        if(data.carpaId && data.fecha) await addDoc(collection(db, "riegos"), data);
    };

    // --- RENDERIZADO MAESTRO ---
    const render = () => {
        const hR = document.getElementById('home-render');
        const cR = document.getElementById('carpas-list-render');
        const pR = document.getElementById('plantas-list-render');
        const rR = document.getElementById('riego-list-render');
        const pSel = document.getElementById('p-sel-carpa');
        const rSel = document.getElementById('r-sel-carpa');

        hR.innerHTML = ""; cR.innerHTML = ""; pR.innerHTML = ""; rR.innerHTML = ""; pSel.innerHTML = ""; rSel.innerHTML = "";

        carpas.forEach(c => {
            pSel.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
            rSel.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
            
            const pDeC = plantas.filter(p => p.carpaId === c.id);
            const htmlPlants = pDeC.map(p => `
                <div class="plant-row">
                    <span>🌱 ${p.genetica} <small>(${calcDias(p.fecha)}d)</small></span>
                    <button class="btn-action btn-del" onclick="del('plantas','${p.id}')">X</button>
                </div>
            `).join('');

            const card = `
                <div class="card-item">
                    <div onclick="const d = this.nextElementSibling; d.style.display = d.style.display === 'none' ? 'block' : 'none'">
                        <span class="badge-oro">Día ${calcDias(c.fecha)}</span><span class="badge-etapa">${c.etapa}</span><br>
                        <b style="font-size:18px; color:var(--oro)">${c.nombre}</b><br>
                        <small>${c.medida} • Clic para ver plantas</small>
                    </div>
                    <div style="display:none; margin-top:10px; border-top:1px solid #333; padding-top:10px">
                        ${htmlPlants || '<small>Sin plantas registradas</small>'}
                        <div style="margin-top:10px">
                            <button class="btn-action btn-edit" onclick="editCarpa('${c.id}','${c.nombre}','${c.medida}','${c.fecha}')">EDITAR CARPA</button>
                            <button class="btn-action btn-del" onclick="del('carpas','${c.id}')">ELIMINAR</button>
                        </div>
                    </div>
                </div>`;
            hR.innerHTML += card;
            cR.innerHTML += card;
        });

        plantas.forEach(p => {
            pR.innerHTML += `<div class="card-item">🌱 ${p.genetica} - ${calcDias(p.fecha)} días <button class="btn-action btn-del" style="float:right" onclick="del('plantas','${p.id}')">Borrar</button></div>`;
        });

        riegos.forEach(r => {
            const carpaNom = carpas.find(c => c.id === r.carpaId)?.nombre || 'Carpa';
            rR.innerHTML += `<div class="card-item">💧 ${carpaNom} - Regada el ${r.fecha}</div>`;
        });

        document.getElementById('h-c-count').innerText = carpas.length;
        document.getElementById('h-p-count').innerText = plantas.length;
    };

    onSnapshot(collection(db, "carpas"), s => { carpas = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
    onSnapshot(collection(db, "plantas"), s => { plantas = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
    onSnapshot(query(collection(db, "riegos"), orderBy("fecha", "desc"), limit(10)), s => { riegos = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });

    window.del = async (col, id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, col, id)); };
</script>
</body>
</html>
