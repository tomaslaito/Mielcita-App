<!-- SECCIÓN: PLANTAS (GESTIÓN TÉCNICA) -->
<div id="sec-plantas" class="container">
    <div class="card-gestion">
        <h4 id="p-form-title" style="color:var(--oro); margin:0">Nueva Planta</h4>
        <input type="hidden" id="p-edit-id">
        
        <select id="p-sel-carpa"><option value="">Seleccionar Carpa</option></select>
        <input type="text" id="p-gen" placeholder="Genética (Ej: Peyote Cookies)">
        
        <div style="background:#111; padding:12px; border-radius:10px; margin:10px 0; border:1px solid #333">
            <label style="color:var(--oro); font-size:11px; text-transform:uppercase">Registro de Tiempos</label>
            
            <div style="margin-top:10px">
                <small style="color:#888">Germinación (Inicio Vida):</small>
                <input type="date" id="p-fec-germ">
            </div>
            
            <div style="margin-top:10px">
                <small style="color:#888">Inicio Vegetativo:</small>
                <input type="date" id="p-fec-vege">
            </div>
            
            <div style="margin-top:10px">
                <small style="color:#888">Inicio Floración:</small>
                <input type="date" id="p-fec-flora">
            </div>
        </div>

        <button class="btn-oro" id="p-btn-main" onclick="savePlanta()">Añadir Planta</button>
        <button class="btn-action btn-del" id="p-btn-cancel" style="display:none; width:100%; margin-top:10px" onclick="resetPlantaForm()">Cancelar Edición</button>
    </div>
</div>

<script type="module">
    // ... (Mantener la configuración de Firebase de los pasos anteriores)

    // FUNCIÓN: RESETEAR FORMULARIO (Crucial para que la edición funcione)
    window.resetPlantaForm = () => {
        document.getElementById('p-edit-id').value = "";
        document.getElementById('p-gen').value = "";
        document.getElementById('p-fec-germ').value = "";
        document.getElementById('p-fec-vege').value = "";
        document.getElementById('p-fec-flora').value = "";
        document.getElementById('p-form-title').innerText = "Nueva Planta";
        document.getElementById('p-btn-main').innerText = "Añadir Planta";
        document.getElementById('p-btn-cancel').style.display = "none";
    };

    // FUNCIÓN: CARGAR PARA EDITAR (Corregida)
    window.editPlanta = (id, carpaId, gen, germ, vege, flora) => {
        navTo('plantas');
        document.getElementById('p-edit-id').value = id;
        document.getElementById('p-sel-carpa').value = carpaId;
        document.getElementById('p-gen').value = gen;
        document.getElementById('p-fec-germ').value = germ || "";
        document.getElementById('p-fec-vege').value = vege || "";
        document.getElementById('p-fec-flora').value = flora || "";
        
        document.getElementById('p-form-title').innerText = "Editando: " + gen;
        document.getElementById('p-btn-main').innerText = "Actualizar Historial";
        document.getElementById('p-btn-cancel').style.display = "block";
    };

    // BOTONES RÁPIDOS: VEGE Y FLORA (Verificados)
    window.cambiarCiclo = async (id, nuevaEtapa) => {
        const hoy = new Date().toISOString().split('T')[0];
        const updates = { etapa: nuevaEtapa, fechaEtapa: hoy };
        
        if(nuevaEtapa === 'Vegetativo') updates.fecVege = hoy;
        if(nuevaEtapa === 'Floración') updates.fecFlora = hoy;
        
        await updateDoc(doc(db, "plantas", id), updates);
    };

    // RENDERIZADO DEL DASHBOARD (Optimizado)
    const render = () => {
        const home = document.getElementById('home-render');
        home.innerHTML = "";

        carpas.forEach(c => {
            const pDeC = plantas.filter(p => p.carpaId === c.id);
            const htmlPlants = pDeC.map(p => {
                const diasTotal = calcDias(p.fecha);
                const diasEtapa = calcDias(p.fechaEtapa);

                return `
                <div class="plant-row">
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <span style="color:var(--oro); font-weight:bold; font-size:16px">🌱 ${p.genetica}</span>
                        <span class="badge-oro" style="font-size:9px">${p.etapa || 'Germinación'}</span>
                    </div>
                    <div class="historial-item" style="margin-top:8px">
                        ⏱️ <b>${diasEtapa} días</b> en ciclo actual<br>
                        📅 Total: ${diasTotal} días de vida
                    </div>
                    <div style="display:flex; gap:5px; margin-top:12px; flex-wrap:wrap">
                        <button class="btn-action btn-blue" onclick="cambiarCiclo('${p.id}', 'Vegetativo')">A VEGE</button>
                        <button class="btn-action btn-blue" onclick="cambiarCiclo('${p.id}', 'Floración')">A FLORA</button>
                        <button class="btn-action btn-edit" onclick="editPlanta('${p.id}','${p.carpaId}','${p.genetica}','${p.fecha}','${p.fecVege || ''}','${p.fecFlora || ''}')">EDITAR FECHAS</button>
                        <button class="btn-action btn-del" onclick="del('plantas','${p.id}')">X</button>
                    </div>
                </div>`;
            }).join('');

            home.innerHTML += `
                <div class="card-item" style="border-left: 4px solid var(--oro)">
                    <div onclick="const d = this.nextElementSibling; d.style.display = d.style.display === 'none' ? 'block' : 'none'">
                        <h3 style="margin:0; color:var(--oro); text-transform:uppercase">${c.nombre}</h3>
                        <small style="color:#666">${c.medida} • Inició: ${c.fecha}</small>
                    </div>
                    <div style="display:none; margin-top:15px; border-top:1px solid #222; padding-top:10px">
                        ${htmlPlants || '<small style="color:#444">No hay plantas registradas aquí.</small>'}
                    </div>
                </div>`;
        });
    };
</script>
