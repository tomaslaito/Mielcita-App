<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mielcita Pro</title>
    <style>
        :root { --negro: #000000; --oro: #D4AF37; --gris-card: #1c1c1e; --blanco: #ffffff; --rojo: #ff3b30; }
        body { background: var(--negro); color: var(--blanco); font-family: -apple-system, sans-serif; margin: 0; }
        header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; background: var(--negro); z-index: 100; }
        .menu-btn { font-size: 28px; color: var(--oro); cursor: pointer; }
        .title { flex-grow: 1; text-align: center; color: var(--oro); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #111; transition: 0.3s; z-index: 200; border-right: 1px solid var(--oro); padding-top: 60px; }
        .sidebar.open { left: 0; }
        .sidebar a { display: block; padding: 20px; color: white; text-decoration: none; border-bottom: 1px solid #222; font-size: 14px; text-transform: uppercase; }
        .overlay { position: fixed; display: none; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; }
        .container { padding: 20px; display: none; }
        .container.active { display: block; }
        .card-gestion { background: var(--gris-card); border-radius: 15px; padding: 18px; margin-bottom: 15px; border: 1px solid #333; }
        .card-item { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid var(--oro); cursor: pointer; position: relative; }
        .btn-oro { background: var(--oro); color: black; border: none; padding: 14px; width: 100%; font-weight: bold; border-radius: 10px; margin-top: 10px; text-transform: uppercase; }
        .actions { display: flex; gap: 8px; margin-top: 10px; }
        .btn-action { flex: 1; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; border: 1px solid; background: none; }
        .btn-edit { color: var(--oro); border-color: var(--oro); }
        .btn-del { color: var(--rojo); border-color: var(--rojo); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .badge-oro { background: var(--oro); color: black; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .badge-etapa { border: 1px solid var(--oro); color: var(--oro); padding: 1px 6px; border-radius: 5px; font-size: 10px; text-transform: uppercase; }
        .plant-list-detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #444; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <div class="title" id="header-title">INICIO</div>
</header>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<nav class="sidebar" id="sidebar">
    <a href="#" onclick="navTo('home')">🏠 Inicio</a>
    <a href="#" onclick="navTo('carpas')">🎪 Gestión de Carpas</a>
    <a href="#" onclick="navTo('plantas')">🌱 Gestión de Plantas</a>
</nav>

<!-- INICIO -->
<div id="sec-home" class="container active">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
        <div class="card-gestion" style="text-align:center"><span id="h-c-count">0</span><br><small>CARPAS</small></div>
        <div class="card-gestion" style="text-align:center"><span id="h-p-count">0</span><br><small>PLANTAS</small></div>
    </div>
    <div id="home-render"></div>
</div>

<!-- CARPAS -->
<div id="sec-carpas" class="container">
    <div class="card-gestion">
        <h4 id="form-title" style="color:var(--oro)">Nueva Carpa</h4>
        <input type="hidden" id="edit-id">
        <input type="text" id="cnom" placeholder="Nombre (Ej: Carpa 1)">
        <input type="text" id="cmed" placeholder="Medidas (Ej: 80x80)">
        <input type="date" id="cfec">
        <button class="btn-oro" id="btn-save" onclick="saveCarpa()">Registrar Carpa</button>
        <button class="btn-action btn-del" id="btn-cancel" style="display:none; width:100%; margin-top:5px" onclick="clearForm()">Cancelar</button>
    </div>
    <div id="list-render"></div>
</div>

<!-- SECCIÓN PLANTAS -->
<div id="sec-plantas" class="container">
    <div class="card-gestion">
        <h4 style="color:var(--oro)">Añadir Planta</h4>
        <select id="psel-carpa"></select>
        <input type="text" id="pgen" placeholder="Genética">
        <input type="text" id="pban" placeholder="Banco">
        <input type="date" id="pfec" title="Fecha germinación">
        <button class="btn-oro" onclick="addPlanta()">Añadir a Carpa</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7ujVTiYTmi0nateG6j49g1",
        authDomain: "mielcita-app.firebaseapp.com",
        projectId: "mielcita-app",
        storageBucket: "mielcita-app.firebasestorage.app",
        messagingSenderId: "937808209169",
        appId: "1:937808209169:web:f280acbc42dd07b1341604"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const calcDias = (f) => Math.floor((new Date() - new Date(f)) / (1000*60*60*24)) || 0;

    let carpas = [];
    let plantas = [];

    window.toggleMenu = () => {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').style.display = document.getElementById('sidebar').classList.contains('open') ? 'block' : 'none';
    };

    window.navTo = (s) => {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById('sec-'+s).classList.add('active');
        document.getElementById('header-title').innerText = s.toUpperCase();
        toggleMenu();
    };

    // --- LÓGICA DE CARPAS (EDITAR / GUARDAR) ---
    window.saveCarpa = async () => {
        const id = document.getElementById('edit-id').value;
        const data = {
            nombre: document.getElementById('cnom').value,
            medida: document.getElementById('cmed').value,
            fecha: document.getElementById('cfec').value
        };

        if(!data.nombre || !data.fecha) return alert("Completa nombre y fecha");

        if(id) {
            await updateDoc(doc(db, "carpas", id), data);
        } else {
            await addDoc(collection(db, "carpas"), { ...data, etapa: 'Germinación' });
        }
        clearForm();
    };

    window.editCarpa = (id, nom, med, fec) => {
        navTo('carpas');
        document.getElementById('edit-id').value = id;
        document.getElementById('cnom').value = nom;
        document.getElementById('cmed').value = med;
        document.getElementById('cfec').value = fec;
        document.getElementById('form-title').innerText = "Editar Carpa";
        document.getElementById('btn-save').innerText = "Actualizar Carpa";
        document.getElementById('btn-cancel').style.display = "block";
    };

    window.clearForm = () => {
        document.getElementById('edit-id').value = "";
        document.getElementById('cnom').value = "";
        document.getElementById('cmed').value = "";
        document.getElementById('cfec').value = "";
        document.getElementById('form-title').innerText = "Nueva Carpa";
        document.getElementById('btn-save').innerText = "Registrar Carpa";
        document.getElementById('btn-cancel').style.display = "none";
    };

    // --- LÓGICA DE PLANTAS ---
    window.addPlanta = async () => {
        const data = {
            carpaId: document.getElementById('psel-carpa').value,
            genetica: document.getElementById('pgen').value,
            banco: document.getElementById('pban').value,
            fecha: document.getElementById('pfec').value
        };
        if(data.genetica && data.carpaId) {
            await addDoc(collection(db, "plantas"), data);
            alert("Planta añadida!");
        }
    };

    // --- RENDERIZADO DINÁMICO ---
    const renderAll = () => {
        const list = document.getElementById('list-render');
        const home = document.getElementById('home-render');
        const select = document.getElementById('psel-carpa');
        
        list.innerHTML = ""; home.innerHTML = ""; select.innerHTML = "";

        carpas.forEach(c => {
            const dias = calcDias(c.fecha);
            const plantasDeCarpa = plantas.filter(p => p.carpaId === c.id);
            
            let plantasHtml = plantasDeCarpa.map(p => `
                <div style="font-size:12px; color:#aaa; margin-bottom:4px;">
                    🌱 ${p.genetica} (${p.banco}) - ${calcDias(p.fecha)} días
                </div>
            `).join('');

            const card = `
                <div class="card-item">
                    <div onclick="this.parentElement.querySelector('.plant-list-detail').style.display = 
                        this.parentElement.querySelector('.plant-list-detail').style.display === 'none' ? 'block' : 'none'">
                        <span class="badge-oro">Día ${dias}</span> <span class="badge-etapa">${c.etapa}</span><br>
                        <b style="font-size:18px; color:var(--oro)">${c.nombre}</b><br>
                        <small>${c.medida} • Inició: ${c.fecha}</small>
                    </div>
                    
                    <div class="plant-list-detail" style="display:none">
                        ${plantasHtml || '<small>Sin plantas registradas</small>'}
                    </div>

                    <div class="actions">
                        <button class="btn-action btn-edit" onclick="editCarpa('${c.id}','${c.nombre}','${c.medida}','${c.fecha}')">EDITAR</button>
                        <button class="btn-action btn-del" onclick="delItem('carpas','${c.id}')">BORRAR</button>
                    </div>
                </div>`;
            
            list.innerHTML += card;
            home.innerHTML += card;
            select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
        });

        document.getElementById('h-c-count').innerText = carpas.length;
        document.getElementById('h-p-count').innerText = plantas.length;
    };

    onSnapshot(collection(db, "carpas"), (snap) => {
        carpas = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderAll();
    });

    onSnapshot(collection(db, "plantas"), (snap) => {
        plantas = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderAll();
    });

    window.delItem = async (col, id) => {
        if(confirm("¿Eliminar este registro?")) await deleteDoc(doc(db, col, id));
    };
</script>
</body>
</html>
