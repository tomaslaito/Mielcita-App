<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --negro: #000; --oro: #D4AF37; --gris: #1c1c1e; --azul: #007aff; --rojo: #ff3b30; }
        body { background: var(--negro); color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding-bottom: 50px; }
        
        /* Layout */
        header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--negro); z-index: 100; }
        .container { padding: 15px; display: none; }
        .container.active { display: block; }
        
        /* UI Elements */
        .card-item { background: var(--gris); border-radius: 12px; padding: 15px; margin-bottom: 12px; border-left: 4px solid var(--oro); position: relative; }
        .plant-row { background: #000; padding: 12px; border-radius: 10px; margin-top: 10px; border: 1px solid #333; }
        .btn-action { padding: 8px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; border: 1px solid; background: none; cursor: pointer; text-transform: uppercase; }
        .btn-blue { color: var(--azul); border-color: var(--azul); }
        .btn-del { color: var(--rojo); border-color: var(--rojo); }
        
        /* Menu ⋮ */
        .menu-dots { position: absolute; right: 15px; top: 15px; font-size: 22px; color: var(--oro); cursor: pointer; padding: 5px; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; border: 1px solid var(--oro); padding: 20px; border-radius: 15px; z-index: 1000; width: 85%; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; }
        
        input, select { width: 100%; padding: 10px; margin: 5px 0 15px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 11px; color: var(--oro); text-transform: uppercase; }
        .btn-save { background: var(--oro); color: #000; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div style="color:var(--oro); font-weight:bold">MI CULTIVO</div>
    <div onclick="navTo('plantas')" style="color:var(--oro); font-size:20px">+</div>
</header>

<!-- DASHBOARD -->
<div id="sec-home" class="container active">
    <div id="render-home"></div>
</div>

<!-- FORMULARIO PLANTAS -->
<div id="sec-plantas" class="container">
    <h3 style="color:var(--oro)">Nueva Planta</h3>
    <select id="p-carpa"></select>
    <input type="text" id="p-gen" placeholder="Genética">
    <label>Fecha de Germinación:</label>
    <input type="date" id="p-fec">
    <button class="btn-save" onclick="crearPlanta()">Guardar Planta</button>
</div>

<!-- MODAL DE EDICIÓN (HISTORIAL) -->
<div class="overlay" id="ov" onclick="closeModal()"></div>
<div class="modal" id="mod">
    <h4 style="color:var(--oro); margin-top:0">Editar Historial</h4>
    <input type="hidden" id="edit-id">
    
    <label>Germinación / Esqueje</label><input type="date" id="h-germ">
    <label>Inicio Vegetativo</label><input type="date" id="h-vege">
    <label>Inicio Floración</label><input type="date" id="h-flora">
    <label>Cosecha</label><input type="date" id="h-cosecha">
    
    <button class="btn-save" onclick="updateFechas()">Guardar Cambios</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7ujVTiYTmi0nateG6j49g1",
        authDomain: "mielcita-app.firebaseapp.com",
        projectId: "mielcita-app",
        storageBucket: "mielcita-app.firebasestorage.app",
        messagingSenderId: "937808209169",
        appId: "1:937808209169:web:f280acbc42dd07b1341604"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let carpas = [], plantas = [];

    // Navegación
    window.navTo = (id) => {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById('sec-'+id).classList.add('active');
    };

    // Cálculos
    const calc = (f) => {
        if(!f) return 0;
        const d = Math.floor((new Date() - new Date(f)) / (1000*60*60*24));
        return d < 0 ? 0 : d;
    };

    // Firebase: Crear
    window.crearPlanta = async () => {
        const p = {
            carpaId: document.getElementById('p-carpa').value,
            genetica: document.getElementById('p-gen').value,
            fecha: document.getElementById('p-fec').value,
            etapa: 'Germinación',
            fechaEtapa: document.getElementById('p-fec').value
        };
        if(!p.carpaId || !p.genetica) return alert("Completa los datos");
        await addDoc(collection(db, "plantas"), p);
        navTo('home');
    };

    // Botones rápidos
    window.setEtapa = async (id, e) => {
        const hoy = new Date().toISOString().split('T')[0];
        const up = { etapa: e, fechaEtapa: hoy };
        if(e === 'Vegetativo') up.fecVege = hoy;
        if(e === 'Floración') up.fecFlora = hoy;
        await updateDoc(doc(db, "plantas", id), up);
    };

    // Modal de Historial
    window.openMod = (id) => {
        const p = plantas.find(x => x.id === id);
        document.getElementById('edit-id').value = id;
        document.getElementById('h-germ').value = p.fecha || "";
        document.getElementById('h-vege').value = p.fecVege || "";
        document.getElementById('h-flora').value = p.fecFlora || "";
        document.getElementById('h-cosecha').value = p.fecCosecha || "";
        document.getElementById('mod').style.display = 'block';
        document.getElementById('ov').style.display = 'block';
    };

    window.closeModal = () => {
        document.getElementById('mod').style.display = 'none';
        document.getElementById('ov').style.display = 'none';
    };

    window.updateFechas = async () => {
        const id = document.getElementById('edit-id').value;
        await updateDoc(doc(db, "plantas", id), {
            fecha: document.getElementById('h-germ').value,
            fecVege: document.getElementById('h-vege').value,
            fecFlora: document.getElementById('h-flora').value,
            fecCosecha: document.getElementById('h-cosecha').value
        });
        closeModal();
    };

    window.eliminar = async (id) => { if(confirm("¿Borrar planta?")) await deleteDoc(doc(db, "plantas", id)); };

    // Renderizado Maestro
    const render = () => {
        const container = document.getElementById('render-home');
        const select = document.getElementById('p-carpa');
        container.innerHTML = "";
        select.innerHTML = '<option value="">Elegir Carpa</option>';

        carpas.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
            const pList = plantas.filter(p => p.carpaId === c.id);

            container.innerHTML += `
                <div class="card-item">
                    <div class="menu-dots" onclick="alert('Usa el ⋮ de la planta para editar fechas')">⋮</div>
                    <h3 style="margin:0; color:var(--oro)">${c.nombre}</h3>
                    <small style="color:#666">${c.medida} • Inició: ${c.fecha}</small>
                    
                    <div style="margin-top:15px">
                        ${pList.map(p => `
                            <div class="plant-row">
                                <div style="display:flex; justify-content:space-between">
                                    <b style="color:var(--oro)">🌱 ${p.genetica}</b>
                                    <div style="color:var(--oro); cursor:pointer" onclick="openMod('${p.id}')">⋮</div>
                                </div>
                                <div style="font-size:11px; margin:5px 0; color:#aaa">
                                    Etapa: ${p.etapa} (${calc(p.fechaEtapa)}d)<br>
                                    Vida Total: ${calc(p.fecha)} días
                                </div>
                                <div style="display:flex; gap:5px; margin-top:8px">
                                    <button class="btn-action btn-blue" onclick="setEtapa('${p.id}','Vegetativo')">Vege</button>
                                    <button class="btn-action btn-blue" onclick="setEtapa('${p.id}','Floración')">Flora</button>
                                    <button class="btn-action btn-del" onclick="eliminar('${p.id}')">X</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });
    };

    onSnapshot(collection(db, "carpas"), s => { carpas = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
    onSnapshot(collection(db, "plantas"), s => { plantas = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
</script>
</body>
</html>
