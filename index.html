<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mielcita Pro - Panel Técnico</title>
    <style>
        :root { --negro: #000000; --oro: #D4AF37; --gris-card: #1c1c1e; --blanco: #ffffff; --rojo: #ff3b30; --verde: #34c759; --azul: #007aff; }
        body { background: var(--negro); color: var(--blanco); font-family: -apple-system, sans-serif; margin: 0; }
        header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; background: var(--negro); z-index: 100; }
        .menu-btn { font-size: 28px; color: var(--oro); cursor: pointer; }
        .title { flex-grow: 1; text-align: center; color: var(--oro); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Sidebar & Overlay */
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #111; transition: 0.3s; z-index: 200; border-right: 1px solid var(--oro); padding-top: 60px; }
        .sidebar.open { left: 0; }
        .sidebar a { display: block; padding: 20px; color: white; text-decoration: none; border-bottom: 1px solid #222; font-size: 14px; text-transform: uppercase; }
        .overlay { position: fixed; display: none; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; }

        /* Contenedores */
        .container { padding: 20px; display: none; }
        .container.active { display: block; }

        /* Cards & UI */
        .card-gestion { background: var(--gris-card); border-radius: 15px; padding: 18px; margin-bottom: 15px; border: 1px solid #333; }
        .card-item { background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid var(--oro); }
        .btn-oro { background: var(--oro); color: black; border: none; padding: 14px; width: 100%; font-weight: bold; border-radius: 10px; margin-top: 10px; text-transform: uppercase; cursor: pointer; }
        .btn-action { padding: 8px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; text-transform: uppercase; border: 1px solid; background: none; cursor: pointer; margin-top: 5px; }
        .btn-edit { color: var(--oro); border-color: var(--oro); }
        .btn-del { color: var(--rojo); border-color: var(--rojo); }
        .btn-blue { color: var(--azul); border-color: var(--azul); }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .badge-oro { background: var(--oro); color: black; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .badge-etapa { border: 1px solid var(--oro); color: var(--oro); padding: 1px 6px; border-radius: 5px; font-size: 10px; text-transform: uppercase; margin-left: 5px; }
        
        .plant-row { padding: 12px; background: #0a0a0a; border-radius: 8px; margin-top: 8px; border: 1px solid #222; }
        .historial-item { font-size: 11px; color: #888; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <div class="title" id="header-title">MI CULTIVO</div>
</header>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<nav class="sidebar" id="sidebar">
    <a href="#" onclick="navTo('home')">🏠 Dashboard</a>
    <a href="#" onclick="navTo('carpas')">🎪 Carpas</a>
    <a href="#" onclick="navTo('plantas')">🌱 Plantas</a>
</nav>

<!-- SECCIÓN: DASHBOARD (VISTA DE CARPAS) -->
<div id="sec-home" class="container active">
    <div id="home-render"></div>
</div>

<!-- SECCIÓN: CARPAS (REGISTRO) -->
<div id="sec-carpas" class="container">
    <div class="card-gestion">
        <h4 id="c-form-title" style="color:var(--oro); margin:0">Nueva Carpa</h4>
        <input type="hidden" id="c-edit-id">
        <input type="text" id="c-nom" placeholder="Nombre (Ej: Carpa 1)">
        <input type="text" id="c-med" placeholder="Medidas (Ej: 80x80)">
        <input type="date" id="c-fec">
        <button class="btn-oro" onclick="saveCarpa()">Guardar Carpa</button>
    </div>
</div>

<!-- SECCIÓN: PLANTAS (EDICIÓN Y REGISTRO) -->
<div id="sec-plantas" class="container">
    <div class="card-gestion">
        <h4 id="p-form-title" style="color:var(--oro); margin:0">Gestionar Planta</h4>
        <input type="hidden" id="p-edit-id">
        <select id="p-sel-carpa"><option>Seleccionar Carpa</option></select>
        <input type="text" id="p-gen" placeholder="Genética (Ej: Peyote Cookies)">
        <input type="text" id="p-ban" placeholder="Banco (Ej: Ecoseeds)">
        <input type="date" id="p-fec" title="Fecha Germinación">
        
        <label style="font-size: 12px; color: var(--oro); margin-top: 10px; display: block;">Programar Cambio de Periodo:</label>
        <select id="p-next-periodo">
            <option value="Vegetativo">Pasar a Vegetativo</option>
            <option value="Floración">Pasar a Floración</option>
            <option value="Cosecha">Programar Cosecha</option>
        </select>
        <input type="date" id="p-fec-cambio" title="Fecha del Cambio">
        
        <button class="btn-oro" id="p-btn-save" onclick="savePlanta()">Guardar Cambios</button>
        <button class="btn-action btn-del" id="p-btn-cancel" style="display:none; width:100%" onclick="resetPlantaForm()">Cancelar Edición</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7ujVTiYTmi0nateG6j49g1",
        authDomain: "mielcita-app.firebaseapp.com",
        projectId: "mielcita-app",
        storageBucket: "mielcita-app.firebasestorage.app",
        messagingSenderId: "937808209169",
        appId: "1:937808209169:web:f280acbc42dd07b1341604"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const calcDias = (f) => {
        if(!f) return 0;
        const diff = new Date() - new Date(f);
        return Math.floor(diff / (1000*60*60*24)) || 0;
    };

    let carpas = [];
    let plantas = [];

    window.toggleMenu = () => {
        const s = document.getElementById('sidebar');
        s.classList.toggle('open');
        document.getElementById('overlay').style.display = s.classList.contains('open') ? 'block' : 'none';
    };

    window.navTo = (s) => {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById('sec-'+s).classList.add('active');
        document.getElementById('header-title').innerText = s.toUpperCase();
        if(document.getElementById('sidebar').classList.contains('open')) toggleMenu();
    };

    // --- CARPAS ---
    window.saveCarpa = async () => {
        const id = document.getElementById('c-edit-id').value;
        const data = { nombre: document.getElementById('c-nom').value, medida: document.getElementById('c-med').value, fecha: document.getElementById('c-fec').value };
        if(!data.nombre || !data.fecha) return;
        id ? await updateDoc(doc(db, "carpas", id), data) : await addDoc(collection(db, "carpas"), { ...data, etapa: 'Iniciado' });
        navTo('home');
    };

    // --- PLANTAS ---
    window.savePlanta = async () => {
        const id = document.getElementById('p-edit-id').value;
        const data = {
            carpaId: document.getElementById('p-sel-carpa').value,
            genetica: document.getElementById('p-gen').value,
            banco: document.getElementById('p-ban').value,
            fecha: document.getElementById('p-fec').value,
            proximoPeriodo: document.getElementById('p-next-periodo').value,
            fechaCambio: document.getElementById('p-fec-cambio').value
        };
        
        if(!data.genetica || !data.carpaId) return alert("Completa los datos");

        if(id) {
            await updateDoc(doc(db, "plantas", id), data);
        } else {
            await addDoc(collection(db, "plantas"), data);
        }
        resetPlantaForm();
        navTo('home');
    };

    window.editPlanta = (p) => {
        navTo('plantas');
        document.getElementById('p-edit-id').value = p.id;
        document.getElementById('p-sel-carpa').value = p.carpaId;
        document.getElementById('p-gen').value = p.genetica;
        document.getElementById('p-ban').value = p.banco;
        document.getElementById('p-fec').value = p.fecha;
        document.getElementById('p-next-periodo').value = p.proximoPeriodo || "Vegetativo";
        document.getElementById('p-fec-cambio').value = p.fechaCambio || "";
        
        document.getElementById('p-form-title').innerText = "Editando: " + p.genetica;
        document.getElementById('p-btn-save').innerText = "Actualizar Planta";
        document.getElementById('p-btn-cancel').style.display = "block";
    };

    window.resetPlantaForm = () => {
        document.getElementById('p-edit-id').value = "";
        document.getElementById('p-gen').value = "";
        document.getElementById('p-ban').value = "";
        document.getElementById('p-fec').value = "";
        document.getElementById('p-fec-cambio').value = "";
        document.getElementById('p-form-title').innerText = "Nueva Planta";
        document.getElementById('p-btn-save').innerText = "Añadir a Carpa";
        document.getElementById('p-btn-cancel').style.display = "none";
    };

    window.del = async (col, id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, col, id)); };

    // --- RENDER ---
    const render = () => {
        const home = document.getElementById('home-render');
        const pSel = document.getElementById('p-sel-carpa');
        home.innerHTML = ""; pSel.innerHTML = '<option value="">Seleccionar Carpa</option>';

        carpas.forEach(c => {
            pSel.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
            const pDeC = plantas.filter(p => p.carpaId === c.id);

            const htmlPlants = pDeC.map(p => `
                <div class="plant-row">
                    <span style="color:var(--oro); font-weight:bold">🌱 ${p.genetica}</span>
                    <span class="historial-item">📅 Germinación: ${p.fecha} (hace ${calcDias(p.fecha)} días)</span>
                    <span class="historial-item" style="color:var(--verde)">⏳ Próximo cambio: ${p.proximoPeriodo} el ${p.fechaCambio || 'TBD'}</span>
                    <div style="display:flex; gap:5px; margin-top:8px">
                        <button class="btn-action btn-edit" onclick="event.stopPropagation(); editPlanta(${JSON.stringify(p).replace(/"/g, '&quot;')})">EDITAR</button>
                        <button class="btn-action btn-del" onclick="event.stopPropagation(); del('plantas','${p.id}')">BORRAR</button>
                    </div>
                </div>
            `).join('');

            home.innerHTML += `
                <div class="card-item">
                    <div onclick="const d = this.nextElementSibling; d.style.display = d.style.display === 'none' ? 'block' : 'none'">
                        <span class="badge-oro">Carpa Activa</span>
                        <h3 style="margin:10px 0 5px 0; color:var(--oro)">${c.nombre}</h3>
                        <small>${c.medida} • Inició: ${c.fecha} (${calcDias(c.fecha)}d)</small>
                    </div>
                    <div style="display:none; margin-top:10px; border-top:1px solid #333; padding-top:10px">
                        ${htmlPlants || '<p style="font-size:11px; color:#555">Sin plantas. Ve a Plantas para añadir.</p>'}
                    </div>
                </div>`;
        });
    };

    onSnapshot(collection(db, "carpas"), s => { carpas = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
    onSnapshot(collection(db, "plantas"), s => { plantas = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
</script>
</body>
</html>
