<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mielcita Pro - Plantas</title>
    <style>
        :root { --negro: #000000; --oro: #D4AF37; --gris-card: #1c1c1e; --blanco: #ffffff; }
        body { background: var(--negro); color: var(--blanco); font-family: -apple-system, sans-serif; margin: 0; }
        header { padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #222; position: sticky; top: 0; background: var(--negro); z-index: 100; }
        .menu-btn { font-size: 28px; color: var(--oro); cursor: pointer; }
        .title { flex-grow: 1; text-align: center; color: var(--oro); font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 260px; height: 100%; background: #111; transition: 0.3s; z-index: 200; border-right: 1px solid var(--oro); padding-top: 60px; }
        .sidebar.open { left: 0; }
        .sidebar a { display: block; padding: 20px; color: white; text-decoration: none; border-bottom: 1px solid #222; font-size: 14px; text-transform: uppercase; }
        .overlay { position: fixed; display: none; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 150; }
        .container { padding: 20px; display: none; }
        .container.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--gris-card); padding: 15px; border-radius: 12px; border-left: 3px solid var(--oro); }
        .stat-val { display: block; font-size: 24px; font-weight: bold; color: var(--oro); }
        .carpa-item { background: var(--gris-card); border-radius: 15px; padding: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .btn-oro { background: var(--oro); color: black; border: none; padding: 14px; width: 100%; font-weight: bold; border-radius: 10px; margin-top: 10px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #222; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn-del { color: #ff3b30; background: none; border: 1px solid #ff3b30; padding: 6px 12px; border-radius: 6px; font-size: 11px; }
        .info-row { font-size: 11px; color: #888; margin-top: 4px; }
        .badge { background: #333; color: var(--oro); padding: 2px 6px; border-radius: 4px; font-size: 9px; text-transform: uppercase; margin-right: 5px; }
    </style>
</head>
<body>

<header>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <div class="title" id="header-title">DASHBOARD</div>
</header>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav class="sidebar" id="sidebar">
    <a href="#" onclick="navTo('home')">🏠 Inicio</a>
    <a href="#" onclick="navTo('carpas')">🎪 Gestionar Carpas</a>
    <a href="#" onclick="navTo('plantas')">🌱 Gestionar Plantas</a>
</nav>

<div id="sec-home" class="container active">
    <div class="stats-grid">
        <div class="stat-card"><span class="stat-val" id="count-c">0</span><span style="font-size:10px;color:#888">CARPAS</span></div>
        <div class="stat-card"><span class="stat-val" id="count-p">0</span><span style="font-size:10px;color:#888">PLANTAS</span></div>
    </div>
    <h3 style="color: #888; font-size: 14px; margin-bottom: 15px;">Tus Carpas</h3>
    <div id="list-home"></div>
</div>

<div id="sec-carpas" class="container">
    <div style="background: #111; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
        <h4 style="margin-top: 0; color: var(--oro);">Nueva Carpa</h4>
        <input type="text" id="cnom" placeholder="Nombre (Ej: Carpa 1)">
        <input type="text" id="cmed" placeholder="Medidas (Ej: 80x80)">
        <button class="btn-oro" onclick="addC()">Registrar</button>
    </div>
    <div id="list-edit-c"></div>
</div>

<div id="sec-plantas" class="container">
    <div style="background: #111; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
        <h4 style="margin-top: 0; color: var(--oro);">Nueva Planta</h4>
        <select id="sel-c"></select>
        <input type="text" id="pgen" placeholder="Genética">
        <input type="text" id="pban" placeholder="Banco (Ej: Ecoseeds)">
        <select id="ptipo">
            <option value="Semilla">Semilla</option>
            <option value="Esqueje">Esqueje</option>
        </select>
        <input type="date" id="pfec" title="Fecha de germinación/inicio">
        <select id="petapa">
            <option value="Germinación">Etapa: Germinación</option>
            <option value="Vegetativo">Etapa: Vegetativo</option>
            <option value="Floración">Etapa: Floración</option>
        </select>
        <button class="btn-oro" onclick="addP()">Añadir Planta</button>
    </div>
    <div id="list-edit-p"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7ujVTiYTmi0nateG6j49g1",
        authDomain: "mielcita-app.firebaseapp.com",
        projectId: "mielcita-app",
        storageBucket: "mielcita-app.firebasestorage.app",
        messagingSenderId: "937808209169",
        appId: "1:937808209169:web:f280acbc42dd07b1341604"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.toggleMenu = () => {
        document.getElementById('sidebar').classList.toggle('open');
        const overlay = document.getElementById('overlay');
        overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
    };

    window.navTo = (section) => {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById('sec-' + section).classList.add('active');
        document.getElementById('header-title').innerText = section.toUpperCase();
        toggleMenu();
    };

    window.addC = async () => {
        const nombre = document.getElementById('cnom').value;
        const medida = document.getElementById('cmed').value;
        if(nombre) await addDoc(collection(db, "carpas"), { nombre, medida });
        document.getElementById('cnom').value = "";
    };

    onSnapshot(collection(db, "carpas"), (snap) => {
        const hList = document.getElementById('list-home');
        const eList = document.getElementById('list-edit-c');
        const sel = document.getElementById('sel-c');
        document.getElementById('count-c').innerText = snap.size;
        hList.innerHTML = ""; eList.innerHTML = ""; sel.innerHTML = "";
        snap.forEach(d => {
            const c = d.data();
            hList.innerHTML += `<div class="carpa-item" onclick="navTo('carpas')"><div><b>🎪 ${c.nombre}</b><br><small style="color:#666">${c.medida}</small></div><span style="background:#1c3d24;color:#4cd964;padding:4px 8px;border-radius:10px;font-size:10px;">ACTIVA</span></div>`;
            eList.innerHTML += `<div class="carpa-item"><span>${c.nombre}</span><button class="btn-del" onclick="delItem('carpas','${d.id}')">Borrar</button></div>`;
            sel.innerHTML += `<option value="${d.id}">${c.nombre}</option>`;
        });
    });

    window.addP = async () => {
        const carpaId = document.getElementById('sel-c').value;
        const genetica = document.getElementById('pgen').value;
        const banco = document.getElementById('pban').value;
        const tipo = document.getElementById('ptipo').value;
        const fecha = document.getElementById('pfec').value;
        const etapa = document.getElementById('petapa').value;
        if(genetica && carpaId) {
            await addDoc(collection(db, "plantas"), { carpaId, genetica, banco, tipo, fecha, etapa });
            document.getElementById('pgen').value = "";
        }
    };

    onSnapshot(collection(db, "plantas"), (snap) => {
        document.getElementById('count-p').innerText = snap.size;
        const pList = document.getElementById('list-edit-p');
        pList.innerHTML = "";
        snap.forEach(d => {
            const p = d.data();
            pList.innerHTML += `<div class="carpa-item">
                <div style="flex-grow:1">
                    <b>${p.genetica}</b> <span class="badge">${p.etapa}</span><br>
                    <div class="info-row">
                        <span class="badge" style="background:#222">${p.tipo}</span> 
                        ${p.banco} • <span style="color:var(--oro)">${p.fecha || 'Sin fecha'}</span>
                    </div>
                </div>
                <button class="btn-del" onclick="delItem('plantas','${d.id}')">Borrar</button>
            </div>`;
        });
    });

    window.delItem = async (col, id) => {
        if(confirm("¿Eliminar este registro?")) await deleteDoc(doc(db, col, id));
    };
</script>
</body>
</html>
