<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mielcita Pro - Gestión de Cultivo</title>
    <style>
        :root { --negro: #0a0a0a; --oro: #D4AF37; --gris: #1a1a1a; --blanco: #f5f5f5; --rojo: #ff4444; }
        body { background: var(--negro); color: var(--blanco); font-family: -apple-system, sans-serif; margin: 0; padding: 15px; padding-bottom: 50px; }
        h1, h2 { color: var(--oro); text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        
        .card { background: var(--gris); border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .flex { display: flex; gap: 10px; }
        
        input, select { width: 100%; padding: 12px; margin: 5px 0; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        
        .btn { background: var(--oro); color: black; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; margin-top: 5px; cursor: pointer; }
        .btn-delete { background: var(--rojo); margin-top: 10px; font-size: 12px; padding: 5px; }
        
        .item-list { border-left: 3px solid var(--oro); padding-left: 10px; margin-top: 10px; position: relative; }
        .tag { font-size: 10px; background: #333; padding: 2px 6px; border-radius: 4px; color: var(--oro); }
    </style>
</head>
<body>

    <h1>Mielcita Control v2</h1>

    <!-- SECCIÓN CARPAS -->
    <div class="card">
        <h2>🎪 Mis Carpas</h2>
        <input type="text" id="carpaNombre" placeholder="Nombre (Ej: Carpa Vegetativo)">
        <input type="text" id="carpaMedida" placeholder="Medida (Ej: 80x80x160)">
        <button class="btn" id="btnNuevaCarpa">+ Registrar Carpa</button>
        <div id="listaCarpas"></div>
    </div>

    <!-- SECCIÓN PLANTAS -->
    <div class="card">
        <h2>🌱 Mis Plantas</h2>
        <select id="selectCarpa"><option value="">Seleccionar Carpa...</option></select>
        <input type="text" id="plantaGenetica" placeholder="Genética (Ej: Gorilla Glue)">
        <input type="text" id="plantaBanco" placeholder="Banco (Ej: RQS)">
        <input type="date" id="plantaFecha">
        <button class="btn" id="btnNuevaPlanta">+ Añadir Planta</button>
        <div id="listaPlantas"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURACIÓN FIREBASE (MANTÉN TUS CLAVES AQUÍ)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO_ID",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- FUNCIONES DE CARPAS ---
        document.getElementById('btnNuevaCarpa').onclick = async () => {
            const nombre = document.getElementById('carpaNombre').value;
            const medida = document.getElementById('carpaMedida').value;
            if(!nombre) return;
            await addDoc(collection(db, "carpas"), { nombre, medida });
            document.getElementById('carpaNombre').value = "";
        };

        onSnapshot(collection(db, "carpas"), (snapshot) => {
            const lista = document.getElementById('listaCarpas');
            const select = document.getElementById('selectCarpa');
            lista.innerHTML = "";
            select.innerHTML = '<option value="">Seleccionar Carpa...</option>';
            
            snapshot.forEach(d => {
                const c = d.data();
                lista.innerHTML += `<div class="item-list">
                    <b>${c.nombre}</b> (${c.medida})
                    <button class="btn-delete" onclick="eliminarDoc('carpas', '${d.id}')">Eliminar</button>
                </div>`;
                select.innerHTML += `<option value="${d.id}">${c.nombre}</option>`;
            });
        });

        // --- FUNCIONES DE PLANTAS ---
        document.getElementById('btnNuevaPlanta').onclick = async () => {
            const carpaId = document.getElementById('selectCarpa').value;
            const genetica = document.getElementById('plantaGenetica').value;
            const banco = document.getElementById('plantaBanco').value;
            const fecha = document.getElementById('plantaFecha').value;
            
            if(!carpaId || !genetica) return alert("Faltan datos");
            
            await addDoc(collection(db, "plantas"), { carpaId, genetica, banco, fecha });
            document.getElementById('plantaGenetica').value = "";
        };

        onSnapshot(collection(db, "plantas"), (snapshot) => {
            const lista = document.getElementById('listaPlantas');
            lista.innerHTML = "";
            snapshot.forEach(d => {
                const p = d.data();
                lista.innerHTML += `<div class="item-list">
                    <b>${p.genetica}</b> <span class="tag">${p.banco}</span><br>
                    <small>Inicio: ${p.fecha}</small>
                    <button class="btn-delete" onclick="eliminarDoc('plantas', '${d.id}')">Eliminar</button>
                </div>`;
            });
        });

        // Función Global para Eliminar
        window.eliminarDoc = async (col, id) => {
            if(confirm("¿Eliminar permanentemente?")) {
                await deleteDoc(doc(db, col, id));
            }
        };
    </script>
</body>
</html>
