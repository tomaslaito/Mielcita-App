<!-- SECCIÓN: CARPAS (REGISTRO E HISTORIAL) -->
<div id="sec-carpas" class="container">
    <!-- Formulario de Entrada -->
    <div class="card-gestion">
        <h4 id="c-form-title" style="color:var(--oro); margin:0">Nueva Carpa</h4>
        <input type="hidden" id="c-edit-id">
        <input type="text" id="c-nom" placeholder="Nombre (Ej: Carpa 1)">
        <input type="text" id="c-med" placeholder="Medidas (Ej: 80x80)">
        <input type="date" id="c-fec">
        <button class="btn-oro" id="c-btn-save" onclick="saveCarpa()">Guardar Carpa</button>
        <button class="btn-action btn-del" id="c-btn-cancel" style="display:none; width:100%; margin-top:10px" onclick="resetCarpaForm()">Cancelar Edición</button>
    </div>

    <!-- Historial de Carpas -->
    <div id="carpas-historial-render">
        <!-- Aquí se renderizan las carpas registradas -->
    </div>
</div>

<script type="module">
    // ... (Mantener inicialización de Firebase igual a la versión anterior)

    // Función para resetear el formulario de carpas
    window.resetCarpaForm = () => {
        document.getElementById('c-edit-id').value = "";
        document.getElementById('c-nom').value = "";
        document.getElementById('c-med').value = "";
        document.getElementById('c-fec').value = "";
        document.getElementById('c-form-title').innerText = "Nueva Carpa";
        document.getElementById('c-btn-save').innerText = "Guardar Carpa";
        document.getElementById('c-btn-cancel').style.display = "none";
    };

    // Función para cargar datos en el formulario para editar
    window.editCarpaFromList = (id, nom, med, fec) => {
        document.getElementById('c-edit-id').value = id;
        document.getElementById('c-nom').value = nom;
        document.getElementById('c-med').value = med;
        document.getElementById('c-fec').value = fec;
        document.getElementById('c-form-title').innerText = "Editando Carpa";
        document.getElementById('c-btn-save').innerText = "Actualizar Carpa";
        document.getElementById('c-btn-cancel').style.display = "block";
        window.scrollTo(0,0); // Sube al formulario
    };

    // Renderizado actualizado para incluir el historial en la sección de carpas
    const renderCarpasHistorial = () => {
        const historialDiv = document.getElementById('carpas-historial-render');
        historialDiv.innerHTML = '<h5 style="color:var(--oro); margin: 10px 0;">Historial de Carpas</h5>';

        carpas.forEach(c => {
            historialDiv.innerHTML += `
                <div class="card-item">
                    <b style="color:var(--oro); font-size:16px;">${c.nombre}</b><br>
                    <small>${c.medida} • Inicio: ${c.fecha}</small>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn-action btn-edit" onclick="editCarpaFromList('${c.id}','${c.nombre}','${c.medida}','${c.fecha}')">EDITAR</button>
                        <button class="btn-action btn-del" onclick="del('carpas','${c.id}')">ELIMINAR</button>
                    </div>
                </div>
            `;
        });
    };

    // Actualizar los listeners de Firebase para que llamen a la nueva función de render
    onSnapshot(collection(db, "carpas"), s => { 
        carpas = s.docs.map(d => ({id:d.id, ...d.data()})); 
        render(); // Renderiza el Dashboard
        renderCarpasHistorial(); // Renderiza el historial en la sección de carpas
    });
</script>
