
<!-- SECCIÓN: PLANTAS (LOGICA DE CICLOS) -->
<div id="sec-plantas" class="container">
    <div class="card-gestion">
        <h4 id="p-form-title" style="color:var(--oro); margin:0">Gestionar Planta</h4>
        <input type="hidden" id="p-edit-id">
        <select id="p-sel-carpa"><option>Seleccionar Carpa</option></select>
        <input type="text" id="p-gen" placeholder="Genética">
        <input type="text" id="p-ban" placeholder="Banco">
        
        <div style="border: 1px solid #333; padding: 10px; border-radius: 8px; margin-top: 10px;">
            <label style="font-size: 11px; color: var(--oro);">Fotoperiodo Actual:</label>
            <select id="p-etapa-act">
                <option value="Germinación">Germinación</option>
                <option value="Vegetativo">Vegetativo (18/6)</option>
                <option value="Floración">Floración (12/12)</option>
            </select>
            <label style="font-size: 11px; color: var(--oro);">Inició el:</label>
            <input type="date" id="p-fec-inicio">
        </div>
        
        <button class="btn-oro" onclick="savePlanta()">Guardar Planta</button>
        <button class="btn-action btn-del" id="p-btn-cancel" style="display:none; width:100%" onclick="resetPlantaForm()">Cancelar</button>
    </div>
</div>

<script type="module">
    // ... (Conexión Firebase anterior)

    // Nueva función para el cambio de fotoperiodo instantáneo
    window.cambiarCicloInstantaneo = async (plantaId, nuevaEtapa) => {
        const hoy = new Date().toISOString().split('T')[0];
        const plantaRef = doc(db, "plantas", plantaId);
        
        try {
            await updateDoc(plantaRef, {
                etapaActual: nuevaEtapa,
                fechaInicioEtapa: hoy,
                // Guardamos el historial del cambio
                [`historial_${nuevaEtapa}`]: hoy
            });
            alert(`Cambiado a ${nuevaEtapa} exitosamente.`);
        } catch (e) {
            console.error("Error al cambiar ciclo: ", e);
        }
    };

    // Renderizado actualizado con historial de fotoperiodo
    const render = () => {
        const home = document.getElementById('home-render');
        home.innerHTML = "";

        carpas.forEach(c => {
            const pDeC = plantas.filter(p => p.carpaId === c.id);

            const htmlPlants = pDeC.map(p => {
                const diasEnEtapa = calcDias(p.fechaInicioEtapa || p.fecha);
                return `
                <div class="plant-row">
                    <span style="color:var(--oro); font-weight:bold">🌱 ${p.genetica}</span>
                    <span class="historial-item">📊 Etapa: <b>${p.etapaActual || 'Germinación'}</b></span>
                    <span class="historial-item">📅 Inició: ${p.fechaInicioEtapa || p.fecha} (${diasEnEtapa} días en este ciclo)</span>
                    
                    <div style="margin-top:10px; display:flex; gap:5px; flex-wrap:wrap">
                        <button class="btn-action btn-blue" onclick="cambiarCicloInstantaneo('${p.id}', 'Vegetativo')">A VEGE</button>
                        <button class="btn-action btn-blue" onclick="cambiarCicloInstantaneo('${p.id}', 'Floración')">A FLORA</button>
                        <button class="btn-action btn-edit" onclick='editPlanta(${JSON.stringify(p)})'>EDITAR</button>
                    </div>
                </div>`;
            }).join('');

            home.innerHTML += `
                <div class="card-item">
                    <div onclick="const d = this.nextElementSibling; d.style.display = d.style.display === 'none' ? 'block' : 'none'">
                        <span class="badge-oro">Carpa Activa</span>
                        <h3 style="margin:10px 0 5px 0; color:var(--oro)">${c.nombre}</h3>
                        <small>${c.medida} • Clic para ver ciclos</small>
                    </div>
                    <div style="display:none; margin-top:10px; border-top:1px solid #333; padding-top:10px">
                        ${htmlPlants || '<p style="font-size:11px; color:#555">Sin plantas.</p>'}
                    </div>
                </div>`;
        });
    };

    // ... (Resto de funciones de Firebase)
</script>
