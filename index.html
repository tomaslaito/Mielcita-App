<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --negro: #000; --oro: #D4AF37; --gris: #151515; --card: #1c1c1e; --azul: #007aff; --rojo: #ff3b30; }
        body { background: var(--negro); color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding-bottom: 30px; }
        
        /* Navbar Superior */
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: var(--negro); position: sticky; top: 0; z-index: 100; }
        .menu-icon { color: var(--oro); font-size: 24px; cursor: pointer; }
        .logo { color: var(--oro); font-weight: bold; letter-spacing: 2px; font-size: 14px; }

        .container { padding: 15px; display: none; }
        .container.active { display: block; }

        /* Estética de la captura image_22.png */
        .card-carpa { background: var(--gris); border-radius: 18px; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--oro); position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .badge-carpa { background: rgba(212, 175, 55, 0.2); color: var(--oro); padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        
        .plant-box { background: #0a0a0a; border: 1px solid #222; border-radius: 14px; padding: 15px; margin-top: 15px; }
        .plant-name { color: var(--oro); font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        /* Botones Estilo Captura */
        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn-ui { flex: 1; padding: 10px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-vege { background: none; border: 1px solid var(--azul); color: var(--azul); }
        .btn-flora { background: none; border: 1px solid var(--azul); color: var(--azul); }
        .btn-del { background: none; border: 1px solid var(--rojo); color: var(--rojo); }

        /* Menú de Tres Puntitos ⋮ */
        .dots-menu { position: absolute; right: 20px; top: 20px; color: var(--oro); font-size: 22px; cursor: pointer; padding: 5px; }

        /* Modal de Edición */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; border: 1px solid var(--oro); padding: 25px; border-radius: 20px; z-index: 1000; width: 85%; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0 18px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; }
        label { font-size: 10px; color: var(--oro); text-transform: uppercase; letter-spacing: 1px; }
        .btn-save { background: var(--oro); color: #000; width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="menu-icon">☰</div>
    <div class="logo">HOME</div>
    <div onclick="window.navTo('plantas')" style="color:var(--oro); font-size:24px">＋</div>
</header>

<!-- DASHBOARD PRINCIPAL -->
<div id="sec-home" class="container active">
    <div id="render-home"></div>
</div>

<!-- FORMULARIO NUEVA PLANTA -->
<div id="sec-plantas" class="container">
    <h3 style="color:var(--oro); text-align:center">NUEVO CULTIVO</h3>
    <label>Ubicación / Carpa</label>
    <select id="p-carpa"></select>
    <label>Variedad / Genética</label>
    <input type="text" id="p-gen" placeholder="Ej: Peyote Cookies">
    <label>Fecha de Germinación</label>
    <input type="date" id="p-fec">
    <button class="btn-save" onclick="window.crearPlanta()">REGISTRAR EN FIREBASE</button>
</div>

<!-- MODAL PARA MODIFICAR FECHAS (⋮) -->
<div class="overlay" id="ov" onclick="window.closeModal()"></div>
<div class="modal" id="mod">
    <h3 style="color:var(--oro); margin-top:0; font-size:16px">MODIFICAR CRONOLOGÍA</h3>
    <input type="hidden" id="edit-id">
    <label>🌱 Germinación / Esqueje</label><input type="date" id="h-germ">
    <label>🌿 Inicio Vegetativo</label><input type="date" id="h-vege">
    <label>🌸 Inicio Floración</label><input type="date" id="h-flora">
    <label>✂️ Cosecha</label><input type="date" id="h-cosecha">
    <button class="btn-save" onclick="window.updateFechas()">GUARDAR CAMBIOS</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7ujVTiYTmi0nateG6j49g1",
        authDomain: "mielcita-app.firebaseapp.com",
        projectId: "mielcita-app",
        storageBucket: "mielcita-app.firebasestorage.app",
        messagingSenderId: "937808209169",
        appId: "1:937808209169:web:f280acbc42dd07b1341604"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let carpas = [], plantas = [];

    window.navTo = (id) => {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById('sec-'+id).classList.add('active');
    };

    const calc = (f) => {
        if(!f) return 0;
        const d = Math.floor((new Date() - new Date(f)) / (1000*60*60*24));
        return d < 0 ? 0 : d;
    };

    window.crearPlanta = async () => {
        const p = {
            carpaId: document.getElementById('p-carpa').value,
            genetica: document.getElementById('p-gen').value,
            fecha: document.getElementById('p-fec').value,
            etapa: 'Germinación',
            fechaEtapa: document.getElementById('p-fec').value
        };
        if(!p.carpaId || !p.genetica) return alert("Faltan datos");
        await addDoc(collection(db, "plantas"), p);
        window.navTo('home');
    };

    window.setEtapa = async (id, e) => {
        const hoy = new Date().toISOString().split('T')[0];
        const up = { etapa: e, fechaEtapa: hoy };
        if(e === 'Vegetativo') up.fecVege = hoy;
        if(e === 'Floración') up.fecFlora = hoy;
        await updateDoc(doc(db, "plantas", id), up);
    };

    window.openMod = (id) => {
        const p = plantas.find(x => x.id === id);
        document.getElementById('edit-id').value = id;
        document.getElementById('h-germ').value = p.fecha || "";
        document.getElementById('h-vege').value = p.fecVege || "";
        document.getElementById('h-flora').value = p.fecFlora || "";
        document.getElementById('h-cosecha').value = p.fecCosecha || "";
        document.getElementById('mod').style.display = 'block';
        document.getElementById('ov').style.display = 'block';
    };

    window.closeModal = () => {
        document.getElementById('mod').style.display = 'none';
        document.getElementById('ov').style.display = 'none';
    };

    window.updateFechas = async () => {
        const id = document.getElementById('edit-id').value;
        await updateDoc(doc(db, "plantas", id), {
            fecha: document.getElementById('h-germ').value,
            fecVege: document.getElementById('h-vege').value,
            fecFlora: document.getElementById('h-flora').value,
            fecCosecha: document.getElementById('h-cosecha').value
        });
        window.closeModal();
    };

    window.eliminar = async (id) => { if(confirm("¿Eliminar registro de planta?")) await deleteDoc(doc(db, "plantas", id)); };

    const render = () => {
        const container = document.getElementById('render-home');
        const select = document.getElementById('p-carpa');
        container.innerHTML = "";
        select.innerHTML = '<option value="">Seleccionar Carpa</option>';

        carpas.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
            const pList = plantas.filter(p => p.carpaId === c.id);

            container.innerHTML += `
                <div class="card-carpa">
                    <span class="badge-carpa">Carpa Activa</span>
                    <h2 style="margin: 10px 0 5px 0; color: var(--oro); font-size: 22px">${c.nombre}</h2>
                    <p style="color: #888; font-size: 13px; margin-bottom: 15px">${c.medida} • Inició: ${c.fecha || 'N/A'}</p>
                    
                    ${pList.map(p => `
                        <div class="plant-box">
                            <div style="display:flex; justify-content:space-between; align-items:center">
                                <div class="plant-name">🌱 ${p.genetica}</div>
                                <div class="dots-menu" onclick="window.openMod('${p.id}')">⋮</div>
                            </div>
                            <div style="margin-top:10px; font-size:12px; color:#ccc">
                                📊 Etapa: <b>${p.etapa}</b><br>
                                ⌛ Días en etapa: ${calc(p.fechaEtapa)} | Total: ${calc(p.fecha)}
                            </div>
                            <div class="btn-group">
                                <button class="btn-ui btn-vege" onclick="window.setEtapa('${p.id}','Vegetativo')">VEGE</button>
                                <button class="btn-ui btn-flora" onclick="window.setEtapa('${p.id}','Floración')">FLORA</button>
                                <button class="btn-ui btn-del" onclick="window.eliminar('${p.id}')">BORRAR</button>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        });
    };

    onSnapshot(collection(db, "carpas"), s => { carpas = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
    onSnapshot(collection(db, "plantas"), s => { plantas = s.docs.map(d => ({id:d.id, ...d.data()})); render(); });
</script>
</body>
</html>
