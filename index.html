<!-- ESTILOS ADICIONALES PARA EL MENÚ ⋮ -->
<style>
    .plant-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .options-btn { color: var(--oro); font-size: 24px; cursor: pointer; padding: 0 5px; }
    
    /* Modal de Historial */
    .modal-historial {
        display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: #111; border: 1px solid var(--oro); padding: 20px; border-radius: 15px;
        z-index: 300; width: 85%; max-width: 400px; box-shadow: 0 0 20px rgba(0,0,0,0.9);
    }
    .modal-historial input { margin-bottom: 12px; }
    .modal-historial label { color: var(--oro); font-size: 11px; text-transform: uppercase; }
</style>

<!-- MODAL PARA EDITAR HISTORIAL DE FECHAS -->
<div class="overlay" id="modal-overlay" onclick="closeModal()"></div>
<div class="modal-historial" id="p-modal">
    <h4 style="color:var(--oro); margin-top:0">Historial de Ciclos</h4>
    <input type="hidden" id="edit-p-id">
    
    <label>Germinación / Esqueje:</label>
    <input type="date" id="hist-germ">
    
    <label>Inicio Vegetativo:</label>
    <input type="date" id="hist-vege">
    
    <label>Inicio Floración:</label>
    <input type="date" id="hist-flora">
    
    <label>Cosecha:</label>
    <input type="date" id="hist-cosecha">
    
    <button class="btn-oro" onclick="updateHistorial()">Actualizar Historial</button>
    <button class="btn-action btn-del" style="width:100%; margin-top:10px" onclick="closeModal()">Cerrar</button>
</div>

<script type="module">
    // ... (Mantener configuración de Firebase anterior)

    // FUNCIÓN PARA ABRIR EL MENÚ DE TRES PUNTITOS
    window.openHistorial = (p) => {
        document.getElementById('edit-p-id').value = p.id;
        document.getElementById('hist-germ').value = p.fecha || "";
        document.getElementById('hist-vege').value = p.fecVege || "";
        document.getElementById('hist-flora').value = p.fecFlora || "";
        document.getElementById('hist-cosecha').value = p.fecCosecha || "";
        
        document.getElementById('p-modal').style.display = "block";
        document.getElementById('modal-overlay').style.display = "block";
    };

    window.closeModal = () => {
        document.getElementById('p-modal').style.display = "none";
        document.getElementById('modal-overlay').style.display = "none";
    };

    // ACTUALIZAR TODAS LAS FECHAS AL INSTANTE
    window.updateHistorial = async () => {
        const id = document.getElementById('edit-p-id').value;
        const updates = {
            fecha: document.getElementById('hist-germ').value,
            fecVege: document.getElementById('hist-vege').value,
            fecFlora: document.getElementById('hist-flora').value,
            fecCosecha: document.getElementById('hist-cosecha').value
        };
        
        await updateDoc(doc(db, "plantas", id), updates);
        closeModal();
    };

    // RENDERIZADO CON EL BOTÓN ⋮ A LA DERECHA
    const render = () => {
        const home = document.getElementById('home-render');
        home.innerHTML = "";

        carpas.forEach(c => {
            const pDeC = plantas.filter(p => p.carpaId === c.id);
            const htmlPlants = pDeC.map(p => {
                const diasTotal = calcDias(p.fecha);
                const diasEtapa = calcDias(p.fechaEtapa);

                return `
                <div class="plant-row">
                    <div class="plant-header">
                        <div>
                            <span style="color:var(--oro); font-weight:bold; font-size:16px">🌱 ${p.genetica}</span><br>
                            <span class="badge-oro" style="font-size:9px; margin-top:4px">${p.etapa || 'Iniciando'}</span>
                        </div>
                        <div class="options-btn" onclick='openHistorial(${JSON.stringify(p)})'>⋮</div>
                    </div>
                    <div class="historial-item" style="margin-top:8px">
                        ⏱️ Ciclo actual: ${diasEtapa} días<br>
                        📅 Vida total: ${diasTotal} días
                    </div>
                    <div style="display:flex; gap:5px; margin-top:12px">
                        <button class="btn-action btn-blue" onclick="cambiarCiclo('${p.id}', 'Vegetativo')">VEGE</button>
                        <button class="btn-action btn-blue" onclick="cambiarCiclo('${p.id}', 'Floración')">FLORA</button>
                        <button class="btn-action btn-del" onclick="del('plantas','${p.id}')">BORRAR</button>
                    </div>
                </div>`;
            }).join('');

            home.innerHTML += `
                <div class="card-item" style="border-left: 4px solid var(--oro)">
                    <div onclick="const d = this.nextElementSibling; d.style.display = d.style.display === 'none' ? 'block' : 'none'">
                        <h3 style="margin:0; color:var(--oro)">${c.nombre}</h3>
                        <small style="color:#666">${c.medida} • Clic para detalles</small>
                    </div>
                    <div style="display:none; margin-top:15px; border-top:1px solid #222; padding-top:10px">
                        ${htmlPlants || '<small>Sin plantas</small>'}
                    </div>
                </div>`;
        });
    };
    // ... (Resto de la lógica Firebase)
</script>
