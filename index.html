<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mielcita Pro - Dashboard</title>
    <style>
        :root { --negro: #000000; --oro: #D4AF37; --gris: #111111; --blanco: #ffffff; --rojo: #cc0000; }
        body { background: var(--negro); color: var(--blanco); font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; }
        
        header { padding: 20px; border-bottom: 1px solid var(--oro); text-align: center; }
        h1 { color: var(--oro); margin: 0; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; }
        
        .nav-bar { display: flex; justify-content: space-around; background: var(--gris); border-bottom: 1px solid #333; }
        .nav-btn { padding: 15px; color: #888; text-decoration: none; font-size: 12px; font-weight: bold; text-transform: uppercase; border: none; background: none; cursor: pointer; }
        .nav-btn.active { color: var(--oro); border-bottom: 2px solid var(--oro); }

        .container { padding: 20px; display: none; }
        .container.active { display: block; }

        /* Dashboard Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--gris); border: 1px solid var(--oro); padding: 20px; border-radius: 15px; text-align: center; }
        .stat-number { display: block; font-size: 32px; font-weight: bold; color: var(--oro); }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }

        /* Form & Lists */
        .card { background: var(--gris); border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 4px solid var(--oro); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn-oro { background: var(--oro); color: black; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; text-transform: uppercase; margin-top: 5px; }
        .btn-del { background: none; color: var(--rojo); border: 1px solid var(--rojo); padding: 5px 10px; border-radius: 5px; font-size: 10px; margin-top: 10px; }
        
        .list-item { padding: 10px 0; border-bottom: 1px solid #222; position: relative; }
        .tag { background: var(--oro); color: black; font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>

<header>
    <h1>El Club de la Mielcita</h1>
</header>

<div class="nav-bar">
    <button class="nav-btn active" onclick="showTab('tab-home')">Inicio</button>
    <button class="nav-btn" onclick="showTab('tab-carpas')">Carpas</button>
    <button class="nav-btn" onclick="showTab('tab-plantas')">Plantas</button>
</div>

<!-- VISTA GENERAL -->
<div id="tab-home" class="container active">
    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-number" id="countCarpas">0</span>
            <span class="stat-label">Carpas Activas</span>
        </div>
        <div class="stat-card">
            <span class="stat-number" id="countPlantas">0</span>
            <span class="stat-label">Total Plantas</span>
        </div>
    </div>
    <div id="resumenReciente"></div>
</div>

<!-- MÓDULO CARPAS -->
<div id="tab-carpas" class="container">
    <div class="card">
        <h3>Nueva Carpa</h3>
        <input type="text" id="cNombre" placeholder="Nombre (Ej: Carpa de Floración)">
        <input type="text" id="cMedida" placeholder="Medida (Ej: 100x100)">
        <button class="btn-oro" onclick="addCarpa()">Guardar Carpa</button>
    </div>
    <div id="listaCarpasFull"></div>
</div>

<!-- MÓDULO PLANTAS -->
<div id="tab-plantas" class="container">
    <div class="card">
        <h3>Nueva Planta</h3>
        <select id="selCarpa"><option value="">Asignar a carpa...</option></select>
        <input type="text" id="pGenetica" placeholder="Genética">
        <input type="text" id="pBanco" placeholder="Banco">
        <input type="date" id="pFecha">
        <button class="btn-oro" onclick="addPlanta()">Añadir al Cultivo</button>
    </div>
    <div id="listaPlantasFull"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // --- PEGA TUS LLAVES DE LA IMAGEN 13 ACÁ ---
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "TU_AUTH_DOMAIN",
        projectId: "TU_PROJECT_ID",
        storageBucket: "TU_STORAGE_BUCKET",
        messagingSenderId: "TU_MESSAGING_ID",
        appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Navegación
    window.showTab = (tabId) => {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    };

    // Lógica de Carpas
    window.addCarpa = async () => {
        const nombre = document.getElementById('cNombre').value;
        const medida = document.getElementById('cMedida').value;
        if(nombre) await addDoc(collection(db, "carpas"), { nombre, medida });
        document.getElementById('cNombre').value = "";
    };

    onSnapshot(collection(db, "carpas"), (snap) => {
        const list = document.getElementById('listaCarpasFull');
        const select = document.getElementById('selCarpa');
        document.getElementById('countCarpas').innerText = snap.size;
        list.innerHTML = "";
        select.innerHTML = '<option value="">Asignar a carpa...</option>';
        snap.forEach(d => {
            const c = d.data();
            select.innerHTML += `<option value="${d.id}">${c.nombre}</option>`;
            list.innerHTML += `<div class="card">
                <b>${c.nombre}</b> <small>(${c.medida})</small><br>
                <button class="btn-del" onclick="deleteItem('carpas', '${d.id}')">Eliminar Carpa</button>
            </div>`;
        });
    });

    // Lógica de Plantas
    window.addPlanta = async () => {
        const carpaId = document.getElementById('selCarpa').value;
        const genetica = document.getElementById('pGenetica').value;
        const banco = document.getElementById('pBanco').value;
        const fecha = document.getElementById('pFecha').value;
        if(genetica && carpaId) await addDoc(collection(db, "plantas"), { carpaId, genetica, banco, fecha });
        document.getElementById('pGenetica').value = "";
    };

    onSnapshot(collection(db, "plantas"), (snap) => {
        document.getElementById('countPlantas').innerText = snap.size;
        const list = document.getElementById('listaPlantasFull');
        list.innerHTML = "";
        snap.forEach(d => {
            const p = d.data();
            list.innerHTML += `<div class="card">
                <b>${p.genetica}</b> <span class="tag">${p.banco}</span><br>
                <small>Inició: ${p.fecha}</small><br>
                <button class="btn-del" onclick="deleteItem('plantas', '${d.id}')">Eliminar Planta</button>
            </div>`;
        });
    });

    window.deleteItem = async (col, id) => {
        if(confirm("¿Eliminar este registro?")) await deleteDoc(doc(db, col, id));
    };
</script>
</body>
</html>
